# Durable Workload: the log sink, the legitimate destination in the
# egress-exfil sandbox demo.
#
# This is NOT the sandbox under test. It is the one host the shipper
# (egress-exfil-sandbox.workload.yaml) is allow-listed to reach, deployed on the
# same machine so the "send to allowed host" button is a real HTTP request that
# really returns 200 and nothing leaves the laptop.
#
#   logsink    exports wasi:http/handler. POST /ingest returns a receipt.
#              Grants: NONE. No volume, allowedHosts: [] (it only receives).
#
# Apply this first: cosmonic_workload_apply(<this file>)
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: egress-exfil-logsink
  namespace: default
  annotations:
    # Published (public ghcr) unsigned image. For Cosmonic Control / production, SIGN the image
    # and REMOVE this annotation.
    desktop.cosmonic.com/unsafe-allow-unsigned: "true"
spec:
  components:
    - name: logsink
      image: ghcr.io/cosmonic-labs/demo-egress-exfil-sandbox/logsink:0.1.0@sha256:4aefaea00b4cf25b028ea8f1db40d2bbaae41b71f995a3d94d37ec3c63d4779b
      poolSize: 4
      localResources:
        allowedHosts: []   # deny-all egress; no volume = zero filesystem authority
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces: [handler]                       # p3 wasi:http/handler@0.3.0
      config:
        host: egress-exfil-logsink.localhost      # http://egress-exfil-logsink.localhost:8200/
