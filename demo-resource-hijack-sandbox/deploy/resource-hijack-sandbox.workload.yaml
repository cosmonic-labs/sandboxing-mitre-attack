# Durable Workload: the resource-hijack sandbox demo (MITRE ATT&CK T1496).
#
# ONE workload, ONE component:
#
#   miner   exports wasi:http/handler (the UI and the /run and /probe
#           endpoints). When driven it runs a CPU-bound hashing loop, tries to
#           start worker threads and processes, grows its memory, dials a
#           "pool", and tries to keep working after the request.
#           Grants: NONE. No volume, allowedHosts: [].
#
# What each line below did when measured on Cosmonic Desktop 0.5.33
# (runtime 2.12.0, macOS/aarch64). See README, "Contained, not removed".
# Not measured on a Cosmonic Control cluster:
#
#   allowedHosts: []    ENFORCED. Both pool dials came back HttpRequestDenied.
#   maxInvocations: 1   ENFORCED. Every request got a fresh instance; grown
#                       memory and background work ended with the request.
#   memoryLimitMb: 32   NOT ENFORCED on Desktop. The component grew to its
#                       own 64 MiB ceiling. Kept here as the declared intent,
#                       and set below that ceiling on purpose: where a host
#                       does enforce it, the probes report stopped_by: platform.
#   cpuLimit: 1         NO OBSERVABLE EFFECT on Desktop. A component is
#                       single-threaded already; the loop ran at full
#                       single-core speed and nothing interrupted it.
#
# The image is in Cosmonic Desktop's built-in registry (oci.localhost:8200),
# pinned by digest. Build and push it first; see cosmonic-app/README.md.
#
# Apply: cosmonic_workload_apply(<this file>)  (or the Control equivalent).
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: resource-hijack-sandbox
  namespace: default
  annotations:
    # The local demo image is unsigned, so Cosmonic Desktop needs this to run
    # it. For a Cosmonic Control / production deployment, SIGN the image and
    # REMOVE this annotation: do not weaken signature enforcement there.
    desktop.cosmonic.com/unsafe-allow-unsigned: "true"
spec:
  components:
    - name: miner
      image: oci.localhost:8200/apps/resource-hijack-sandbox-miner:0.1.3@sha256:9ef3eb8cf0ea665d26061c5196a06fe3e956ba95b7e67e5f08df20b59e07619a
      # Lifecycle: one warm instance, retired after ONE request. This is the
      # control that reaps the miner. Nothing the component did (grown memory,
      # a task left running after the response) outlives its request.
      poolSize: 1
      maxInvocations: 1
      localResources:
        memoryLimitMb: 32   # declared, below the 64 MiB in-component ceiling (see above)
        cpuLimit: 1         # declared; no observable effect on Desktop
        allowedHosts: []    # deny-all egress; no volume = zero filesystem authority
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces: [handler]                             # p3 wasi:http/handler@0.3.0
      config:
        host: resource-hijack-sandbox.localhost         # http://resource-hijack-sandbox.localhost:8200/
