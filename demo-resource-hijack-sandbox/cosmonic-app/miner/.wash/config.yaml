# wash v2 config for the MINER component (the only component in this demo).
#
# Serves the branded UI and runs the resource-hijack probes. It has NO
# filesystem (no volume) and NO network egress.
version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/resource_hijack_miner.wasm
workload:
  # Deny-all egress: the "dial a pool" attempt has nowhere to go.
  allowedHosts: []
  # No volumeMounts, no volumes: this component has no on-disk authority at all.
