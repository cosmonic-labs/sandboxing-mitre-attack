# wash v2 config for the WEB component.
#
# Serves the branded UI and builds the two demo records. It has NO filesystem
# (no volume) and NO network egress. On /run it passes the record bytes to the
# parser and reads the vault, both across the host runtime link.
version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/memory_boundary_web.wasm
workload:
  # Deny-all egress. The web component calls nothing server-side.
  allowedHosts: []
  # No volumeMounts, no volumes: this component has no on-disk authority at all.
